name: build

on:
  workflow_call:

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/build.sh osx-arm64 out
      - uses: actions/upload-artifact@v7
        with:
          name: kcap-postgres-osx-arm64
          path: out/*.tar.gz
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-24.04, image: quay.io/pypa/manylinux_2_28_x86_64 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64 }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/install-build-deps.sh
      - run: bash scripts/build.sh ${{ matrix.rid }} out
      - uses: actions/upload-artifact@v7
        with:
          name: kcap-postgres-${{ matrix.rid }}
          path: out/*.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        shell: pwsh
        run: |
          choco install winflexbison3 --no-progress -y
          python -m pip install --quiet meson ninja
          python -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> $env:GITHUB_PATH
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          "%ProgramFiles%\Git\bin\bash.exe" scripts/build.sh win-x64 out
      - uses: actions/upload-artifact@v7
        with:
          name: kcap-postgres-win-x64
          path: out/*.tar.gz
          if-no-files-found: error

  # Smoke runs on a fresh machine, never the one that built the archive.
  smoke-macos:
    needs: build-macos
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kcap-postgres-osx-arm64
          path: out
      - run: bash scripts/smoke.sh out/*.tar.gz

  smoke-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kcap-postgres-${{ matrix.rid }}
          path: out
      - name: Smoke on the runner
        run: bash scripts/smoke.sh out/*.tar.gz
      - name: Smoke on a bare Debian 11
        run: |
          archive=$(basename out/*.tar.gz)
          docker run --rm -v "$PWD:/w:ro" debian:11-slim \
            bash -c "useradd -m pg && su pg -c 'bash /w/scripts/smoke.sh /w/out/$archive'"

  smoke-windows:
    needs: build-windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kcap-postgres-win-x64
          path: out
      - name: Smoke on the runner
        shell: bash
        run: bash scripts/smoke.sh out/*.tar.gz
      # The runner has the VC++ runtime installed; Server Core does not, so only the archive's own copy can serve.
      - name: Smoke on a bare Windows Server Core
        shell: pwsh
        run: |
          $archive = (Get-ChildItem out/*.tar.gz).Name
          docker run --rm -v "${PWD}:C:\w:ro" -v "${env:ProgramFiles}\Git:C:\git:ro" mcr.microsoft.com/windows/servercore:ltsc2025 `
            cmd /c "if exist C:\Windows\System32\vcruntime140.dll (echo the image has the VC++ runtime installed & exit /b 1) else C:\git\bin\bash.exe /c/w/scripts/smoke.sh /c/w/out/$archive"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
